html {
  color-scheme: dark;
}
.theme-switching,
.theme-switching * {
  transition: none !important;
}
body {
  font-family: var(--font-sans);
  background-color: var(--color-background);
  color: var(--color-foreground);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.5;
  font-size: 14px;
}
html {
  font-optical-sizing: auto;
}
::selection {
  background-color: var(--color-primary);
  color: var(--color-primary-foreground);
}
:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
.font-title {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 0.98;
  text-wrap: balance;
}
.tnum {
  font-variant-numeric: tabular-nums;
}
.eyebrow {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0;
  color: var(--color-subtle-foreground);
}
.card {
  background: var(--color-surface);
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.raised {
  background: var(--color-raised);
  box-shadow: var(--raise-ring, 0 0 0 0 transparent), var(--shadow-raise);
}
.ring-raise-primary {
  --raise-ring: 0 0 0 1.5px var(--color-primary);
}
.ring-raise-success {
  --raise-ring: 0 0 0 1.5px var(--color-success);
}
.sunken {
  background: var(--color-sunken);
  box-shadow: var(--shadow-sunken);
}
.shadow-card {
  box-shadow: var(--shadow-card);
}
.shadow-card-hover {
  box-shadow: var(--shadow-card);
}
.dh-accent-left {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 3px solid var(--color-primary);
  border-radius: var(--radius-lg);
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--color-border-strong) transparent;
}
@keyframes shimmer {
  0% {
    background-position: -400px 0;
  }
  100% {
    background-position: 400px 0;
  }
}
.skeleton {
  background: linear-gradient(90deg, var(--color-surface-2) 25%, var(--color-surface-3) 37%, var(--color-surface-2) 63%);
  background-size: 800px 100%;
  animation: shimmer 1.4s infinite linear;
  border-radius: var(--radius-sm);
}
@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
.toast-in {
  animation: toast-in 0.18s ease-out;
}
@keyframes drawer-in {
  from {
    transform: translateX(24px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}
.drawer-in {
  animation: drawer-in 0.2s ease-out;
}

.font-serif-italic {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 600;
}
.font-pixel {
  font-family: "Silkscreen", var(--font-mono);
}
.font-helvetica {
  font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
  font-weight: 700;
  font-variation-settings: normal;
}
.radar-icon .radar-sweep {
  transform-origin: 12px 12px;
  animation: radar-sweep 2.6s linear infinite;
}
.radar-icon .radar-blip {
  animation: radar-blip 2.6s ease-out infinite;
}
@keyframes radar-sweep {
  to {
    transform: rotate(360deg);
  }
}
@keyframes radar-blip {
  0%,
  30% {
    opacity: 0;
  }
  38% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .radar-icon .radar-sweep,
  .radar-icon .radar-blip {
    animation: none;
  }
}
.ov-ticker-track {
  animation: ov-ticker 48s linear infinite;
}
.ov-ticker:hover .ov-ticker-track,
.ov-ticker:focus-within .ov-ticker-track {
  animation-play-state: paused;
}
@keyframes ov-ticker {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}
@media (prefers-reduced-motion: reduce) {
  .ov-ticker-track {
    animation: none;
  }
}
.queue-deck {
  position: relative;
  margin: 14px 16px 44px;
  border-radius: 14px;
  background: var(--color-raised);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1) inset,
    0 14px 0 -6px var(--color-border-strong),
    0 15px 0 -6px rgba(0, 0, 0, 0.5),
    0 30px 36px -16px rgba(0, 0, 0, 0.9);
}
.queue-deck-3 {
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1) inset,
    0 14px 0 -6px var(--color-border-strong),
    0 15px 0 -6px rgba(0, 0, 0, 0.5),
    0 27px 0 -12px var(--color-border),
    0 40px 40px -18px rgba(0, 0, 0, 0.9);
}
.wiz-steps {
  display: flex;
  align-items: center;
  margin: 0;
  padding: 8px 0;
  list-style: none;
  perspective: 1600px;
  perspective-origin: 50% 20%;
}
.wiz-step {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  opacity: 0.5;
  transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1),
    opacity 0.3s,
    filter 0.3s;
}
.wiz-step + .wiz-step {
  margin-left: -10px;
}
.wiz-step[data-pos="active"] {
  opacity: 1;
  filter: drop-shadow(0 12px 14px var(--color-scrim)) drop-shadow(0 2px 0 var(--color-scrim));
}
.wiz-step:has(button:not(:disabled)):hover {
  opacity: 0.85;
}
.wiz-step-card {
  display: flex;
  width: 100%;
  height: 48px;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 0 22px;
  font-size: 14px;
  font-weight: 600;
}
.wiz-step-card:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}

  align-items: flex-start;
}
.hero-points svg {
  flex: none;
  margin-top: 0.18em;
  color: var(--ink);
}
/* Mobilde metin turuncu bölümde → düğme siyah; masaüstünde siyah zeminde → düğme turuncu */
.hero-cta {
  background: var(--ink);
  color: var(--cream);
  box-shadow: var(--l-cta-shadow);
}
.hero-cards {
  display: grid;
  gap: 12px;
  margin: 0;
  padding: 28px 0 36px;
}
/* Kartlar (rev3): düz koyu yüzey, her zaman siyah zeminde — turuncu üstüne binmez, yarı saydam değil */
.hero-card {
  display: flex;
  align-items: center;
  gap: 16px;
  border-radius: 18px;
  background: var(--l-panel);
  border: 1px solid var(--line);
  color: var(--cream);
  padding: 16px 18px;
}
.hero-card-big {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.04em;
  font-size: 28px;
  line-height: 1;
  white-space: nowrap;
  color: var(--apricot);
}
.hero-card-title {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--cream);
}
.hero-card-text {
  margin-top: 3px;
  font-size: 14.5px;
  line-height: 1.4;
  color: var(--l-card-text);
}

/* Masaüstü: kompozisyon (1440×900 tasarım ölçüsü; 1 birim = 1vw, en çok 19.2px) */
@media (min-width: 1024px) {
  .hero {
    /* Birim hem genişliğe hem yüksekliğe uyar: kompozisyon (1440×900 oranı) ekrana sığar, ilk ekranda kartlar görünür */
    --u: min(1vw, 1.6vh, 19.2px);
    --pad: calc(4 * var(--u));
    /* 1440×900 oranı; ekran daha yüksekse (tablet/dar dizüstü) boşluk alttan büyür, ilk ekranı doldurur */
    min-height: max(calc(62.5 * var(--u)), min(100svh, calc(75 * var(--u))));
    background: var(--ink);
  }
  /* Kompozisyon ekrandan darsa sağ kenar: panonun devamı. Sahneye 2px biner → kenarda ince çizgi kalmaz */
  .hero-stage::after {
    content: "";
    position: absolute;
    top: 0;
    left: calc(100% - 2px);
    width: calc((100vw - 100%) / 2 + 4px);
    height: 37%;
    background: var(--tangerine);
    pointer-events: none;
  }
  .hero-stage {
    position: relative;
    width: calc(100 * var(--u));
    min-height: inherit;
    margin: 0 auto;
    background: var(--ink);
    display: flex;
    flex-direction: column;
  }
  .hero-fields {
    display: block;
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hero-fields::before,
  .hero-fields::after {
    content: "";
    position: absolute;
    inset: 0;
  }
  /* rev4 (29. oturum): turuncu pano yalnızca COOKED'un arkasında; altındaki metin ve kutular siyahta */
  .hero-fields::before {
    background: var(--tangerine);
    clip-path: polygon(69% 0, 100% 0, 100% 37%, 63% 37%);
  }
  /* 30. oturum: kumlu doku katmanı kaldırıldı — yalnızca ekran içindeki panoyu açıyordu, sağ kenarla iki ton görünüyordu */
  .hero-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 var(--pad) calc(4.4 * var(--u));
  }
  .hero-nav {
    height: auto;
    padding-top: calc(2.1 * var(--u));
    /* 30. oturum (kullanıcı): sahne ekrandan darsa sağ grup (Giriş · CV'ni yükle · TR/EN) ekranın sağ kenarına
       uzanır — sağdaki boşluk kullanılır, bağlantılarla çakışmaz */
    margin-right: min(0px, calc((100 * var(--u) - 100vw) / 2 + 24px));
    /* sahne dışındaki turuncu uzantının (.hero-stage::after) altında kalmasın */
    position: relative;
    z-index: 2;
  }
  /* 47. oturum (kullanıcı): bağlantılar koyu, yatay bir panelde — turuncu panoya taşsa da okunur, tek blok görünür */
  .hero-links {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-left: calc(2.6 * var(--u));
    padding: 5px;
    border: 1px solid var(--l-pill-line);
    border-radius: 999px;
    background: var(--l-pill);
    box-shadow: var(--l-pill-shadow);
    font-size: 14.5px;
    /* 30. oturum (kullanıcı): bağlantılar beyaz ve kalın — daha görünür */
    font-weight: 600;
    color: var(--cream);
  }
  .hero-links a {
    padding: 8px 15px;
    border-radius: 999px;
    transition: background-color 0.15s, color 0.15s;
  }
  .hero-links a:hover {
    color: var(--apricot);
    background: var(--l-pill-hover);
  }
  .hero-label {
    margin-top: calc(7.4 * var(--u));
    font-size: 13px;
  }
  /* rev4 (29. oturum): "JOB MARKET" sol kenara, "COOKED" sağ kenara taşar (içerik boşluğunun dışına);
     ortası Pac-Man'in yolu olarak boş kalır */
  .meme {
    margin: calc(1.8 * var(--u)) calc(-1.6 * var(--u)) 0;
    font-size: calc(6.3 * var(--u));
    display: flex;
    align-items: center;
  }
  .meme-row {
    margin-top: 0;
    flex: 1;
  }
  .pac {
    margin-left: 0.3em;
  }
  .pellets {
    flex: 1;
    justify-content: space-evenly;
    padding: 0 0.8em;
  }
  .cooked {
    color: var(--ink);
    opacity: 0.92;
    --cooked-opacity: 0.92;
    text-shadow: 0.05em 0.05em 0 var(--l-cooked-shadow);
  }
  /* Dev yazı: Türkçe ÖLDÜ kısa → 1,5 kat; İngilizce COOKED uzun → 1,3 kat. Pano içinde kalsın diye hafif yukarı */
  .meme-tr .cooked {
    --cooked-size: 1.5em;
    --cooked-y: -0.08em;
  }
  .meme-en .cooked {
    --cooked-size: 1.3em;
    --cooked-y: -0.06em;
  }
  .hero-sub {
    display: grid;
    grid-template-columns: 1fr max(calc(36 * var(--u)), 400px);
    align-items: end;
    gap: calc(2 * var(--u));
    margin-top: calc(6.6 * var(--u));
  }
  .hero-h1 {
    font-size: calc(4.3 * var(--u));
  }
  .hero-copy {
    margin: 0;
    padding: 0;
    background: none;
    clip-path: none;
    color: var(--cream);
    font-size: clamp(17px, calc(1.3 * var(--u)), 22px);
    line-height: 1.45;
  }
  .hero-points svg {
    color: var(--apricot);
  }
  .hero-cta {
    background: var(--tangerine);
    color: var(--ink);
    box-shadow: none;
  }
  .hero-copy-note {
    color: var(--mute);
  }
  .hero-cards {
    margin: auto 0 0;
    padding: calc(2.6 * var(--u)) 0 0;
    background: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .hero-card {
    padding: calc(1.3 * var(--u)) calc(1.5 * var(--u));
    gap: calc(1.3 * var(--u));
  }
  .hero-card-big {
    font-size: clamp(24px, calc(2.2 * var(--u)), 38px);
  }
}

/* Ret cümleleri şeridi */
.marquee {
  overflow: hidden;
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}
.marquee-track {
  display: flex;
  gap: 48px;
  width: max-content;
  animation: marquee 52s linear infinite;
}
@keyframes marquee {
  to {
    transform: translateX(-50%);
  }
}

@media (prefers-reduced-motion: reduce) {
  .pac-body,
  .pellets i,
  .marquee-track,
  .meme .cooked {
    animation: none !important;
  }
}

/* ── Hareket katmanı (52. oturum, taste-skill S1) — components/landing/landing-motion.tsx ──────────────────
   İlk ekran: `html.lm` (satır içi betik boyamadan önce yazar). Bölümler: `html.lm-js` (bileşen yazar; ekrandaki bloklar
   baştan `.is-in`). Hareket azaltmada iki sınıf da yazılmaz → her şey baştan görünür, hiçbir şey oynamaz. */
.landing {
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.76, 0, 0.24, 1);
}
@media (prefers-reduced-motion: no-preference) {
  /* 1) İlk ekran: etiket, iki satır başlık maskeden, vaatler, düğme; derinlik kartları arkadan (öndeki en son) */
  html.lm .landing .m-rise {
    opacity: 0;
    translate: 0 20px;
    animation: m-rise 0.8s var(--ease-out) forwards;
    animation-delay: calc(var(--m-i, 0) * 90ms + 120ms);
  }
  html.lm .landing .m-line {
    display: block;
    overflow: hidden;
    padding-bottom: 0.1em;
    margin-bottom: -0.1em;
  }
  html.lm .landing .m-line > span {
    display: block;
    translate: 0 105%;
    animation: m-lineup 0.9s var(--ease-out) forwards;
    animation-delay: calc(var(--m-i, 0) * 110ms + 380ms);
  }
  html.lm .landing .hero-card.m-card {
    opacity: 0;
    translate: 0 34px;
    scale: 0.94;
    animation: m-card 1s var(--ease-out) forwards;
    animation-delay: calc(var(--m-i, 0) * 140ms + 900ms);
  }

  /* 2) Bölüm girişleri — her bölüm kendi biçimiyle */
  html.lm-js .landing .m-up {
    transition:
      opacity 0.7s var(--ease-out),
      translate 0.9s var(--ease-out);
    transition-delay: var(--reveal-delay, calc(var(--m-i, 0) * 80ms));
  }
  html.lm-js .landing .m-up:not(.is-in) {
    opacity: 0;
    translate: 0 26px;
  }
  html.lm-js .landing .m-left {
    transition:
      opacity 0.6s var(--ease-out),
      translate 0.8s var(--ease-out);
    transition-delay: calc(var(--m-i, 0) * 90ms);
  }
  html.lm-js .landing .m-left:not(.is-in) {
    opacity: 0;
    translate: -28px 0;
  }
  html.lm-js .landing .m-arrow {
    transform-origin: left center;
    transition: scale 0.6s var(--ease-out);
    transition-delay: calc(var(--m-i, 0) * 120ms + 250ms);
  }
  html.lm-js .landing .m-arrow:not(.is-in) {
    scale: 0 1;
  }

  /* ürün sahnesi: arka katman kayar, öndeki parça hafif dönerek oturur; eski satır çizilir, yeni satır açılır */
  html.lm-js .landing .m-stage .frag-ghost {
    transition:
      opacity 0.7s var(--ease-out),
      translate 1s var(--ease-out);
  }
  html.lm-js .landing .m-stage:not(.is-in) .frag-ghost {
    opacity: 0;
    translate: 0 30px; /* yalnız dikey: yatay kayma telefonda sayfayı genişletiyordu */
  }
  html.lm-js .landing .m-stage .frag-front {
    transition:
      opacity 0.7s var(--ease-out) 0.15s,
      translate 1s var(--ease-out) 0.15s,
      rotate 1s var(--ease-out) 0.15s;
  }
  html.lm-js .landing .m-stage:not(.is-in) .frag-front {
    opacity: 0;
    translate: 0 40px;
    rotate: -2deg;
  }
  html.lm-js .landing .m-stage .frag-line-old .line-through {
    position: relative;
    text-decoration: none;
  }
  html.lm-js .landing .m-stage .frag-line-old .line-through::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 55%;
    height: 1.5px;
    background: currentColor;
    transform-origin: left;
    transition: scale 0.7s var(--ease-in-out) 0.9s;
  }
  html.lm-js .landing .m-stage:not(.is-in) .frag-line-old .line-through::after {
    scale: 0 1;
  }
  html.lm-js .landing .m-stage .frag-line-new {
    transition: clip-path 0.9s var(--ease-in-out) 1.5s;
  }
  html.lm-js .landing .m-stage:not(.is-in) .frag-line-new {
    clip-path: inset(0 100% 0 0);
  }
  /* Mail Radarı: satır satır, durum hapları en son yerine oturur */
  html.lm-js .landing .m-stage .frag-row {
    transition:
      opacity 0.5s var(--ease-out),
      translate 0.7s var(--ease-out);
    transition-delay: calc(var(--m-i, 0) * 140ms + 500ms);
  }
  html.lm-js .landing .m-stage:not(.is-in) .frag-row {
    opacity: 0;
    translate: 0 14px;
  }
  html.lm-js .landing .m-stage .frag-status {
    transition:
      scale 0.38s var(--ease-out),
      opacity 0.3s;
    transition-delay: calc(var(--m-i, 0) * 140ms + 850ms);
  }
  html.lm-js .landing .m-stage:not(.is-in) .frag-status {
    scale: 0.6;
    opacity: 0;
  }

  /* çubuklar sıfırdan büyür (huni, filtreler, yıllık başvuru) */
  html.lm-js .landing .m-barx {
    transform-origin: left center;
    transition: scale 1.1s var(--ease-out);
    transition-delay: calc(var(--m-i, 0) * 120ms + 200ms);
  }
  html.lm-js .landing .m-barx:not(.is-in) {
    scale: 0 1;
  }
  html.lm-js .landing .m-bary {
    transform-origin: center bottom;
    transition: scale 1.1s var(--ease-out);
    transition-delay: calc(var(--m-i, 0) * 160ms + 200ms);
  }
  html.lm-js .landing .m-bary:not(.is-in) {
    scale: 1 0;
  }

  /* kapanış başlıkları kelime kelime maskeden */
  html.lm-js .landing .m-word {
    display: inline-block;
    overflow: hidden;
    vertical-align: bottom;
    padding-bottom: 0.12em;
    margin-bottom: -0.12em;
  }
  html.lm-js .landing .m-word > span {
    display: inline-block;
    transition: translate 0.9s var(--ease-out);
    transition-delay: calc(var(--m-i, 0) * 120ms);
  }
  html.lm-js .landing h2:not(.is-in) .m-word > span {
    translate: 0 110%;
  }

  /* 3) İmza: ret cümlelerini yiyen Pac-Man — şerit durur, Pac-Man kaydırmayla yürür */
  html.lm-js .landing .marquee {
    position: relative;
    mask-image: none;
  }
  html.lm-js .landing .marquee-track {
    animation-play-state: paused;
  }
  html.lm-js .landing .marquee-pac {
    display: block;
  }
  .landing .marquee-track > span {
    transition:
      opacity 0.26s ease,
      scale 0.26s var(--ease-out);
  }
  .landing .marquee-track > span.m-eaten {
    opacity: 0.16;
    scale: 0.92;
    text-decoration: line-through;
    text-decoration-color: var(--apricot);
  }

  /* 4) Elin altında: basınca iner */
  .landing a.rounded-full:active,
  .landing button:active {
    scale: 0.97;
  }
}
.landing .marquee-pac {
  display: none;
  position: absolute;
  top: 50%;
  left: 0;
  z-index: 2;
  margin: 0;
  font-size: 34px;
  translate: -50% -50%;
  pointer-events: none;
}
.landing .marquee-pac .pac-body {
  background: var(--apricot);
}
@keyframes m-rise {
  to {
    opacity: 1;
    translate: 0 0;
  }
}
@keyframes m-lineup {
  to {
    translate: 0 0;
  }
}
@keyframes m-card {
  to {
    opacity: 1;
    translate: 0 0;
    scale: 1;
  }
}

/* ── İK koltuğu (47. oturum) — components/landing/hr-chair.tsx ── */
.hr-card-in {

/* ═════════════════════════════════════════════════════════════════
   PROTOTİP (52. oturum, taste-skill denetimi) — "AI görüntüsünü azalt, derinlik kat".
   Onaylanmadı; yalnız bulut kopyasında. Her blok bir öneri kimliği taşır (K = küçük, O = orta).
   ═════════════════════════════════════════════════════════════════ */

/* K4: ilk ekran başlığı dik; ikinci satır turuncu kalır */
.hero-h1-upright {
  font-family: var(--font-display);
  font-style: normal;
  font-weight: 700;
  letter-spacing: -0.035em;
}

/* D — DERİNLİK TOKENLARI (kullanıcı isteği: "biri önde, arkadaşı geride"). Yakın olan açık tonda, uzaktaki koyu;
   gölge yalnız katmanlı nesnelerde. --px/--py fareyle değişir (components/landing/depth-parallax.tsx). */
.landing {
  --px: 0;
  --py: 0;
  --l-elev-back: #151311;
  --l-elev-mid: #1d1a17;
  --l-elev-front: #2a2520;
  --l-depth-edge: inset 0 1px 0 rgba(255, 244, 232, 0.07);
  --l-depth-near: 0 44px 80px -28px rgba(0, 0, 0, 0.9), 0 14px 28px -14px rgba(0, 0, 0, 0.7);
  --l-depth-far: 0 18px 36px -20px rgba(0, 0, 0, 0.8);
}
:root[data-theme="paper"] .landing {
  --l-elev-back: #ebe7d8;
  --l-elev-mid: #f4f1e6;
  --l-elev-front: #fdfcf7;
  --l-depth-edge: inset 0 1px 0 rgba(255, 255, 255, 0.8);
  --l-depth-near: 0 40px 70px -26px rgba(48, 44, 28, 0.38), 0 12px 24px -12px rgba(48, 44, 28, 0.22);
  --l-depth-far: 0 14px 28px -16px rgba(48, 44, 28, 0.22);
}
:root[data-theme="forest"] .landing {
  --l-elev-back: #111a16;
  --l-elev-mid: #17221d;
  --l-elev-front: #22312a;
  --l-depth-edge: inset 0 1px 0 rgba(238, 240, 230, 0.07);
  --l-depth-near: 0 44px 80px -28px rgba(0, 6, 3, 0.9), 0 14px 28px -14px rgba(0, 6, 3, 0.7);
  --l-depth-far: 0 18px 36px -20px rgba(0, 6, 3, 0.8);
}

/* D1: ilk ekranın üç kartı — telefonda üst üste binen bir deste, masaüstünde perspektifli üç katman */
.hero-card {
  position: relative;
  border: 0;
  background: var(--l-elev-mid);
  box-shadow: var(--l-depth-edge), var(--l-depth-far);
  transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1), background-color 0.3s, box-shadow 0.4s;
}
.hero-card[data-depth="front"] {
  z-index: 2;
  background: var(--l-elev-front);
  box-shadow: var(--l-depth-edge), var(--l-depth-near);
  transform: scale(1.03);
}
.hero-card[data-depth^="back"] {
  background: var(--l-elev-back);
}
.hero-card[data-depth^="back"] > * {
  opacity: 0.86;
}
.hero-card-text {
  color: var(--l-text-2);
}
@media (max-width: 1023px) {
  .hero-cards {
    gap: 0;
  }
  .hero-card + .hero-card {
    margin-top: -6px;
  }
  .hero-card[data-depth^="back"] {
    margin-inline: 10px;
  }
}
@media (min-width: 1024px) {
  .hero-cards {
    perspective: 1600px;
    perspective-origin: 50% 20%;
    grid-template-columns: 1fr 1.1fr 1fr;
    gap: 0;
    align-items: center;
  }
  .hero-card {
    padding: calc(1.6 * var(--u)) calc(1.8 * var(--u));
    gap: calc(1.3 * var(--u));
    --d: 6px; /* paralaks: arkadakiler az kayar */
    transform: translate3d(calc(var(--px) * var(--d)), calc(var(--py) * var(--d)), 0);
  }
  /* arkadaki kartın öndekinin altında kalan kenarına içerik girmesin */
  .hero-card[data-depth="back-l"] {
    padding-right: calc(3.4 * var(--u));
    transform: translate3d(calc(var(--px) * var(--d) + 1.6 * var(--u)), calc(var(--py) * var(--d)), -90px) rotateY(9deg);
    transform-origin: right center;
  }
  .hero-card[data-depth="back-r"] {
    padding-left: calc(3.6 * var(--u));
    transform: translate3d(calc(var(--px) * var(--d) - 1.6 * var(--u)), calc(var(--py) * var(--d)), -90px) rotateY(-9deg);
    transform-origin: left center;
  }
  .hero-card[data-depth="front"] {
    --d: 16px; /* öndeki çok kayar */
    padding-block: calc(2.1 * var(--u));
    transform: translate3d(calc(var(--px) * var(--d)), calc(var(--py) * var(--d)), 30px);
  }
  /* üstüne gelinen kart öne çıkar (yalnız fareyle) */
  @media (hover: hover) {
    .hero-cards:hover .hero-card[data-depth="front"]:not(:hover) {
      background: var(--l-elev-mid);
      box-shadow: var(--l-depth-edge), var(--l-depth-far);
    }
    .hero-card[data-depth^="back"]:hover {
      z-index: 3;
      background: var(--l-elev-front);

w-[60ch] text-[18px] leading-relaxed text-[var(--l-text-2)]">Companies collect applications in an ATS. If your CV lacks the job post's words, you don't show up in searches.</p></div><dl class="mt-10 grid gap-7 sm:mt-12 sm:grid-cols-3 sm:gap-10" data-reveal="true"><div><dt class="sr-only">of Fortune 500 use an ATS</dt><dd class="grid grid-cols-[minmax(0,auto)_minmax(0,1fr)] items-center gap-x-4 sm:block"><span class="font-title block text-[46px] leading-none tracking-[-0.04em] text-apricot sm:text-[88px]">98.4%</span><span class="block min-w-0"><span aria-hidden="true" class="block max-w-[28ch] text-[16px] leading-snug text-cream sm:mt-4 sm:text-[17px]">of Fortune 500 use an ATS</span><span class="mt-1 block text-[13px] text-[var(--mute)] sm:mt-2">Jobscan, 2025</span></span></dd></div><div><dt class="sr-only">of employers say good candidates get filtered out for not matching the post exactly</dt><dd class="grid grid-cols-[minmax(0,auto)_minmax(0,1fr)] items-center gap-x-4 sm:block"><span class="font-title block text-[46px] leading-none tracking-[-0.04em] text-apricot sm:text-[88px]">88%</span><span class="block min-w-0"><span aria-hidden="true" class="block max-w-[28ch] text-[16px] leading-snug text-cream sm:mt-4 sm:text-[17px]">of employers say good candidates get filtered out for not matching the post exactly</span><span class="mt-1 block text-[13px] text-[var(--mute)] sm:mt-2">Harvard Business School &amp; Accenture, 2021</span></span></dd></div><div><dt class="sr-only">first look at a CV</dt><dd class="grid grid-cols-[minmax(0,auto)_minmax(0,1fr)] items-center gap-x-4 sm:block"><span class="font-title block text-[46px] leading-none tracking-[-0.04em] text-apricot sm:text-[88px]">7.4 s</span><span class="block min-w-0"><span aria-hidden="true" class="block max-w-[28ch] text-[16px] leading-snug text-cream sm:mt-4 sm:text-[17px]">first look at a CV</span><span class="mt-1 block text-[13px] text-[var(--mute)] sm:mt-2">Ladders, 2018</span></span></dd></div></dl><h3 class="font-title mt-24 text-[30px] sm:text-[40px]" data-reveal="true">How an ATS screens you</h3><ol class="ats-funnel mt-6 grid gap-8 lg:grid-cols-4 lg:gap-6"><li data-reveal="true" style="--reveal-delay:0ms"><span aria-hidden="true" class="mb-5 block h-2.5 rounded-full bg-apricot" style="width:100%;opacity:1"></span><p class="text-[20px] font-semibold text-cream">Parsing</p><p class="mt-2 text-[16px] leading-[1.5] text-[var(--l-text-2)]">Your CV becomes plain text. Tables, columns and icons lose information.</p></li><li data-reveal="true" style="--reveal-delay:90ms"><span aria-hidden="true" class="mb-5 block h-2.5 rounded-full bg-apricot" style="width:76%;opacity:0.8"></span><p class="text-[20px] font-semibold text-cream">Screening questions</p><p class="mt-2 text-[16px] leading-[1.5] text-[var(--l-text-2)]">Work permit, location, certificates. Miss one and you're out.</p></li><li data-reveal="true" style="--reveal-delay:180ms"><span aria-hidden="true" class="mb-5 block h-2.5 rounded-full bg-apricot" style="width:52%;opacity:0.6"></span><p class="text-[20px] font-semibold text-cream">Search and filters</p><p class="mt-2 text-[16px] leading-[1.5] text-[var(--l-text-2)]">Recruiters search by keyword. No matching words, no match.</p></li><li data-reveal="true" style="--reveal-delay:270ms"><span aria-hidden="true" class="mb-5 block h-2.5 rounded-full bg-apricot" style="width:28%;opacity:0.3999999999999999"></span><p class="text-[20px] font-semibold text-cream">Human eyes</p><p class="mt-2 text-[16px] leading-[1.5] text-[var(--l-text-2)]">A few seconds on title, company and dates.</p></li></ol><div class="mt-12 grid gap-4 lg:grid-cols-2"><figure class="rounded-[22px] bg-[var(--l-panel)] p-7" data-reveal="true"><figcaption class="text-[17px] font-semibold text-cream">What do recruiters filter by in the ATS?</figcaption><ul aria-label="99.7 percent of recruiters use filters, 76.4 percent filter by skills and 55.3 percent by job title." class="mt-6 space-y-5" role="img"><li title="Use filters in their ATS: 99.7%"><div class="flex items-baseline justify-between gap-3 text-[14px]"><span class="text-cream/85">Use filters in their ATS</span><b class="tnum font-semibold text-cream">99.7%</b></div><div class="mt-2 h-2.5 rounded-[4px]" style="background:var(--l-track)"><div class="h-full rounded-[4px]" style="width:99.7%;background:var(--l-mark)"></div></div></li><li title="Filter by skills: 76.4%"><div class="flex items-baseline justify-between gap-3 text-[14px]"><span class="text-cream/85">Filter by skills</span><b class="tnum font-semibold text-cream">76.4%</b></div><div class="mt-2 h-2.5 rounded-[4px]" style="background:var(--l-track)"><div class="h-full rounded-[4px]" style="width:76.4%;background:var(--l-mark)"></div></div></li><li title="Filter by job title: 55.3%"><div class="flex items-baseline justify-between gap-3 text-[14px]"><span class="text-cream/85">Filter by job title</span><b class="tnum font-semibold text-cream">55.3%</b></div><div class="mt-2 h-2.5 rounded-[4px]" style="background:var(--l-track)"><div class="h-full rounded-[4px]" style="width:55.3%;background:var(--l-mark)"></div></div></li></ul><div class="mt-9 flex items-center gap-4"><span class="font-title shrink-0 text-[44px] leading-none text-apricot">10.6×</span><span class="text-[14px] leading-snug text-cream/85">more interview invitations for CVs whose job title matches the job post</span></div><p class="mt-4 text-[13px] leading-snug text-[var(--mute)]">Jobscan, State of the Job Search 2025 · 384 recruiters, 2.5 million applications</p></figure><figure class="rounded-[22px] bg-[var(--l-panel)] p-7" data-reveal="true" style="--reveal-delay:90ms"><figcaption class="text-[17px] font-semibold text-cream">Average applications per job</figcaption><div class="mt-6 flex items-end gap-6"><div class="min-w-0 flex-1"><div aria-label="The average job got 116 applications in 2022 and 244 in 2025." class="flex h-[180px] items-end gap-6 border-b border-[var(--line)] px-2" role="img"><div class="flex h-full flex-1 flex-col items-center justify-end" title="2022: 116"><b class="tnum mb-2 text-[22px] font-semibold text-cream">116</b><div class="w-full max-w-[96px] rounded-t-[4px]" style="height:61.803278688524586px;background:var(--l-muted-bar)"></div></div><div class="flex h-full flex-1 flex-col items-center justify-end" title="2025: 244"><b class="tnum mb-2 text-[22px] font-semibold text-cream">244</b><div class="w-full max-w-[96px] rounded-t-[4px]" style="height:130px;background:var(--l-mark)"></div></div></div><div aria-hidden="true" class="tnum flex gap-6 px-2 pt-2 text-[13px] text-[var(--mute)]"><span class="flex-1 text-center">2022</span><span class="flex-1 text-center">2025</span></div></div><div class="shrink-0 pb-8 text-right"><span class="font-title block text-[44px] leading-none text-apricot">2.1×</span><span class="mt-1 block text-[13px] text-[var(--mute)]">in three years</span></div></div><p class="mt-6 border-l-2 border-apricot pl-3 text-[14px] leading-snug text-cream/85">Each recruiter now handles 4,890 applications a year.</p><p class="mt-4 text-[13px] leading-snug text-[var(--mute)]">Greenhouse, Hiring Benchmarks · 6,000+ companies, 640 million applications</p></figure><div class="flex flex-col rounded-[22px] bg-[var(--l-raised-2)] p-7 lg:col-span-2" data-reveal="true"><p class="text-[15px] font-semibold text-[var(--mute)]">Myth</p><p class="font-title mt-2 text-[24px] leading-tight text-cream/60 line-through decoration-apricot decoration-2">“An ATS throws away 75% of CVs before anyone sees them.”</p><p class="mt-3 max-w-[75ch] text-[16px] leading-[1.5] text-[var(--l-text-2)]">There's no research behind this number: it came from a 2012 sales pitch by a company selling CV services (Preptel). In a 2025 survey of 25 recruiters, 23 said their systems don't auto-reject CVs based on content.</p><p class="mt-7 text-[15px] font-semibold text-apricot">Reality</p><p class="mt-2 max-w-[60ch] text-[22px] font-semibold leading-snug text-cream">The real screening is quieter: if your CV can't be parsed or doesn't contain the job post's words, you're not in the list when a recruiter searches.</p><p class="mt-auto pt-4 text-[13px] leading-snug text-[var(--mute)]">Enhancv, 2025 (25 recruiters) · The Interview Guys</p></div></div><h3 class="font-title mt-28 text-[34px] sm:text-[48px]" data-reveal="true">How deHumiliator fixes this</h3><ul class="mt-12 grid gap-10"><li class="grid gap-2 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] lg:gap-12" data-reveal="true" style="--reveal-delay:0ms"><p class="font-title text-[28px] leading-[1.1] text-cream sm:text-[36px]">A format ATS can read</p><p class="max-w-[52ch] text-[17px] leading-[1.5] text-[var(--l-text-2)] lg:pt-2">One column, standard headings, one date format. No tables, icons or images.</p></li><li class="grid gap-2 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] lg:gap-12" data-reveal="true" style="--reveal-delay:90ms"><p class="font-title text-[28px] leading-[1.1] text-cream sm:text-[36px]">The job post's words, if you have the proof</p><p class="max-w-[52ch] text-[17px] leading-[1.5] text-[var(--l-text-2)] lg:pt-2">Skills and terms from the job post go into your CV where your experience backs them up. We never add what isn't there.</p></li><li class="grid gap-2 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] lg:gap-12" data-reveal="true" style="--reveal-delay:180ms"><p class="font-title text-[28px] leading-[1.1] text-cream sm:text-[36px]">A headline that fits the job</p><p class="max-w-[52ch] text-[17px] leading-[1.5] text-[var(--l-text-2)] lg:pt-2">The target title at the top is tuned to the job post; your past job titles stay untouched.</p></li></ul><details class="mt-12 text-[13px] text-[var(--mute)]"><summary class="cursor-pointer select-none text-[14px] font-semibold hover:text-cream">Sources</summary><ol class="mt-3 list-decimal space-y-1.5 pl-5"><li><a class="inline-block py-1.5 underline decoration-[var(--line)] underline-offset-2 hover:text-cream" href=  mt-6 grid gap-8 lg:grid-cols-4 lg:gap-6"><li data-reveal="true" style="--reveal-delay:0ms"><span aria-hidden="true" class="mb-5 block h-2.5 rounded-full bg-apricot" style="width:100%;opacity:1"></span><p class="text-[20px] font-semibold text-cream">Ayrıştırma</p><p class="mt-2 text-[16px] leading-[1.5] text-[var(--l-text-2)]">CV düz metne çevrilir. Tablo, sütun ve ikon bilgiyi kaybettirir.</p></li><li data-reveal="true" style="--reveal-delay:90ms"><span aria-hidden="true" class="mb-5 block h-2.5 rounded-full bg-apricot" style="width:76%;opacity:0.8"></span><p class="text-[20px] font-semibold text-cream">Eleme soruları</p><p class="mt-2 text-[16px] leading-[1.5] text-[var(--l-text-2)]">Çalışma izni, konum, belge. Şartı tutmayan otomatik düşer.</p></li><li data-reveal="true" style="--reveal-delay:180ms"><span aria-hidden="true" class="mb-5 block h-2.5 rounded-full bg-apricot" style="width:52%;opacity:0.6"></span><p class="text-[20px] font-semibold text-cream">Arama ve filtre</p><p class="mt-2 text-[16px] leading-[1.5] text-[var(--l-text-2)]">İşe alımcı kelimeyle arar. İlanın kelimeleri yoksa görünmezsin.</p></li><li data-reveal="true" style="--reveal-delay:270ms"><span aria-hidden="true" class="mb-5 block h-2.5 rounded-full bg-apricot" style="width:28%;opacity:0.3999999999999999"></span><p class="text-[20px] font-semibold text-cream">İnsan gözü</p><p class="mt-2 text-[16px] leading-[1.5] text-[var(--l-text-2)]">Birkaç saniyelik bakış: unvan, şirket, tarih.</p></li></ol><div class="mt-12 grid gap-4 lg:grid-cols-2"><figure class="rounded-[22px] bg-[var(--l-panel)] p-7" data-reveal="true"><figcaption class="text-[17px] font-semibold text-cream">İşe alımcılar ATS'de neye göre arıyor?</figcaption><ul aria-label="Filtre kullanan işe alımcılar: yüzde 99,7. Beceriye göre filtreleyen: yüzde 76,4. Unvana göre filtreleyen: yüzde 55,3." class="mt-6 space-y-5" role="img"><li title="ATS'de filtre kullanıyor: %99,7"><div class="flex items-baseline justify-between gap-3 text-[14px]" ; wrote data-quality checks that caught 2 billing bugs.","Answered ad-hoc SQL requests from sales and support teams within one day; built a self-serve Looker view for the top 10.","Prepared the monthly merchant health report for the leadership team (GMV, take rate, churn)."]},{title:"Turkcell, Business Intelligence Intern",sub:"Istanbul, Turkey",date:"Jun 2020 \u2013 Sep 2020",bullets:["Analysed prepaid top-up behaviour in SQL; findings fed a new loyalty offer.","Rebuilt 6 Excel reports as one Power BI report with row-level security."]}]},{h:"PROJECTS",kind:"entries",entries:[{title:"Churn early-warning model (Python, scikit-learn)",text:"Flagged 70% of churners two weeks ahead on a public telecom dataset; feature importance shared as a short write-up."},{title:"Istanbul rent tracker (Python, Power BI)",text:"Scraped 25k listings a month; dashboard of median rent by district, used by 2 local newsletters."}]},{h:"EDUCATION",kind:"entries",entries:[{title:"Middle East Technical University, B.Sc. Industrial Engineering",date:"2017 \u2013 2021",text:"Coursework: Statistics, Operations Research, Databases, Simulation \xB7 GPA 3.38 / 4.00"}]},{h:"CERTIFICATES",kind:"inline",text:"Microsoft PL-300 Power BI Data Analyst (2023) \xB7 Google Advanced Data Analytics (2022)"},{h:"LANGUAGES",kind:"inline",text:"Turkish (Native) \xB7 English (Fluent, C1) \xB7 German (A2)"}]},{kind:"wall",good:!1,name:"Daniel Okafor",contact:"Ankara \xB7 daniel.okafor@mail.com \xB7 05\u25CF\u25CF \u25CF\u25CF\u25CF \u25CF\u25CF \u25CF\u25CF",paragraphs:["PROFILE \u2014 I would describe myself as a lifelong learner who is a natural team player, a strong communicator, an analytical thinker and a highly capable problem solver who thrives in fast-paced, dynamic environments and always strives to exceed expectations. Throughout my academic and professional journey I have consistently demonstrated initiative, adaptability and a results-oriented mindset, and I am passionate about leveraging data to drive meaningful business outcomes and create value for all stakeholders.","During my university years I held roles in many student societies, including the Debate Club, the Entrepreneurship Society and the Photography Club, where I helped organise events, managed social media accounts, coordinated volunteers and gained valuable leadership experience. I also completed an internship at a logistics company where I worked with different departments, prepared reports, attended meetings, supported the operations team with various tasks and got to know the corporate culture closely.","After graduation I worked as an operations assistant for a year and a half. My responsibilities included preparing weekly reports for the management team, following up on supplier orders, updating spreadsheets, answering customer e-mails and supporting my manager on special projects. I received positive feedback for my attention to detail and my ability to meet deadlines under pressure.","In my current role I am also responsible for keeping the supplier database up to date, coordinating with the warehouse team when shipments are delayed, and preparing presentations for the monthly review meeting. I enjoy finding small ways to make our processes more efficient, for example by creating templates that save time for the whole team, and I am always happy to support colleagues when the workload is high.","EDUCATION \u2014 I graduated from the Department of Business Administration at Gazi University in 2019 with a final-year project on customer satisfaction in the retail sector, for which I designed a survey, collected responses from more than 200 participants and analysed the results. During my studies I also took elective courses in marketing, organisational behaviour and introductory statistics.","My interests include travel, photography, chess and long-distance running; I completed my first half marathon last year. I volunteered at an education charity teaching maths to primary school children for two years. I want to progress in a data-related field and I keep developing myself in that direction through online courses and self-study.","References available on request. Driving licence (B). Military service completed."],footnote:"Also: Excel, basic SQL, introduction to Python (online course)"},{kind:"dense",good:!0,header:"dark",name:"Sara Lindqvist",title:"Data Analyst",contact:"Izmir, Turkey \xB7 sara.lindqvist@mail.com \xB7 github.com/saral",chips:["SQL","Python","Power BI","A/B testing","dbt","Looker"],sections:[{h:"EXPERIENCE",kind:"entries",entries:[{title:"Blue Bank, Customer Analytics Analyst",date:"2020 \u2013 Present",bullets:["Built a Python churn model that cut card churn by 12% in the pilot segment.","Owned 14 Power BI reports for the retail banking committee; reduced refresh time from 3 h to 20 min with incremental loads.","Wrote the SQL layer (dbt) for 60+ customer metrics with tests and documentation.","Designed and read out 9 A/B tests on onboarding e-mails and app banners."]},{title:"Deloitte, Analytics Intern",date:"Summer 2019",bullets:["Prepared data for a credit-risk scorecard project; automated 4 Excel reports with Python.","Built a Power BI prototype for the audit team's sampling workflow."]},{title:"Hacettepe University, Teaching Assistant \u2014 Statistics",date:"2018 \u2013 2020",bullets:["Led weekly R and SQL lab sessions for 60 students; wrote 10 graded assignments."]}]},{h:"PROJECTS",kind:"entries",entries:[{title:"Open-data dashboard: Izmir public transport (Power BI)",text:"Ridership by line and hour; featured in the city's open-data newsletter."},{title:"Uplift modelling for e-mail campaigns (Python)",text:"Two-model approach on 400k customers; +8% incremental response vs. random targeting."}]},{h:"PUBLICATIONS",kind:"entries",entries:[{title:"\u201CSurvival models for credit-card churn\u201D \u2014 Turkish Statistics Congress",date:"2020"}]},{h:"EDUCATION",kind:"entries",entries:[{title:"Hacettepe University, B.Sc. Statistics",date:"2016 \u2013 2020",text:"GPA 3.41 / 4.00 \xB7 Thesis: survival models for customer churn"}]},{h:"CERTIFICATES",kind:"inline",text:"Microsoft PL-300 (Power BI Data Analyst) \xB7 Google Data Analytics"},{h:"LANGUAGES",kind:"inline",text:"Turkish (Native) \xB7 English (C1) \xB7 Swedish (B1)"}]},{kind:"dense",good:!1,header:"left",name:"Kerem Aslan",title:"Senior Sales Representative",contact:"Bursa, Turkey \xB7 kerem.aslan@mail.com \xB7 05\u25CF\u25CF \u25CF\u25CF\u25CF \u25CF\u25CF \u25CF\u25CF",sections:[{h:"SUMMARY",kind:"text",text:"Results-driven sales professional with 6 years of B2B experience in automotive and industrial equipment. Consistently exceeds quarterly targets and builds long-term dealer relationships."},{h:"EXPERIENCE",kind:"entries",entries:[{title:"Star Motors, Senior Sales Representative",date:"2019 \u2013 Present",bullets:["Exceeded monthly sales targets in 22 of 24 months; top performer in the Marmara region in 2023.","Managed relationships with 35 dealers and negotiated annual framework agreements.","Trained 6 new sales representatives on the product range and CRM usage.","Prepared weekly pipeline reports for the regional sales manager in Excel."]},{title:"Anatolia Machinery, Sales Representative",date:"2017 \u2013 2019",bullets:["Opened 18 new B2B accounts in the textile sector.","Organised product demos at 5 trade fairs.","Kept the customer list and visit plans up to date in the CRM."]},{title:"Y\u0131ld\u0131z Holding, Customer Service Representative",date:"2015 \u2013 2017",bullets:["Handled 60+ customer calls a day; resolution rate 92%.","Prepared monthly complaint summaries for the team leader."]}]},{h:"ACHIEVEMENTS",kind:"inline",text:"Salesperson of the Year 2023 (Marmara) \xB7 President's Club 2021 \xB7 3\xD7 quarterly target award"},{h:"EDUCATION",kind:"entries",entries:[{title:"Anadolu University, Business Administration",date:"2013 \u2013 2017"}]},{h:"SKILLS",kind:"inline",text:"Negotiation \xB7 CRM (Salesforce) \xB7 Key account management \xB7 Presentation \xB7 MS Office"},{h:"LANGUAGES",kind:"inline",text:"Turkish (Native) \xB7 English (Intermediate)"},{h:"HOBBIES",kind:"inline",text:"Football \xB7 Fishing \xB7 Travel"},{h:"OTHER",kind:"inline",text:"Driving licence (B) \xB7 Non-smoker \xB7 Available for travel \xB7 Military service completed"}]},{kind:"sidebar",good:!1,name:"Luc\xEDa Ferrer",title:"YOUNG PROFESSIONAL",photo:"face",side:[{h:"CONTACT",lines:["lucia.ferrer@mail.com","+90 5\u25CF\u25CF \u25CF\u25CF\u25CF \u25CF\u25CF \u25CF\u25CF","Istanbul"]},{h:"HOBBIES",lines:["Swimming","Books","Cinema","Travel"]},{h:"LANGUAGES",lines:["English","Spanish"],bars:[{pct:60}]},{h:"PERSONALITY",lines:["Creative","Energetic","Team player"]}],sections:[{h:"ABOUT ME",kind:"text",text:"I am a dynamic, energetic and goal-oriented young professional who loves creating content and working with people. I am looking for an opportunity to grow in a fast-paced company."},{h:"EXPERIENCE",kind:"entries",entries:[{title:"Nova Agency, Social Media Intern",date:"2023",bullets:["Created social media content for 4 brands.","Wrote captions and scheduled posts.","Helped organise a product launch event."]},{title:"Caf\xE9 Luna, Barista (part-time)",date:"2021 \u2013 2022",bullets:["Served customers and handled the cash register.","Trained two new baristas."]},{title:"Ege University Radio, Volunteer Presenter",date:"2020 \u2013 2022",bullets:["Hosted a weekly music show and wrote the programme notes."]}]},{h:"EDUCATION",kind:"entries",entries:[{title:"Ege University, Communication Studies",date:"2019 \u2013 2023",text:"Erasmus semester \u2014 Universidad de Valencia (2022)"}]},{h:"CERTIFICATES",kind:"inline",text:"Digital Marketing Fundamentals \xB7 Canva Design School \xB7 First Aid"},{h:"ACHIEVEMENTS",kind:"text",text:"Best short film award at the faculty festival (2021). Organised a charity concert that raised funds for a local animal shelter."},{h:"REFERENCES",kind:"text",text:"Available on request."}],footno </script><script>
(function(){
  var app=document.getElementById('app');
  function pick(){var l=null;try{l=localStorage.getItem('dh_lang')}catch(e){}
    if(l!=='en'&&l!=='tr') l=(navigator.language||'').toLowerCase().indexOf('tr')===0?'tr':'en'; return l;}
  function show(l,keep){
    var t=document.getElementById('tpl-'+l);
    app.innerHTML='';app.appendChild(t.content.cloneNode(true));
    document.documentElement.lang=l;document.title=t.getAttribute('data-title');
    try{localStorage.setItem('dh_lang',l)}catch(e){}
    window.__mount(l);
    if(!keep) window.scrollTo(0,0);
  }
  window.__setLang=function(l){var y=window.scrollY;show(l,true);window.scrollTo(0,y);};
  show(pick(),true);
})();
</script></body></html>
